# V90 Web — GitHub Pages'e yayın (ADR-013, docs/v90/02-architecture.md §12.2).
#
# `expo export --platform web` → dist-web/ ; ardından scripts/web-postexport.mjs
# 404.html (SPA yedeği), manifest.webmanifest ve sw.js (çevrimdışı kabuk)
# ekler. Çıktı `gh-pages` dalına yazılır; Pages bu dalı yayınlar. Alt yol:
# depo herkese açık olduğu için adres https://<kullanıcı>.github.io/kredi-karti-takip/
# — V90_WEB_BASE_URL app.config.ts üzerinden EXPO_BASE_URL'e dönüşür.
#
# Neden dal, "GitHub Actions" kaynağı değil: `actions/configure-pages`'in
# `enablement: true` adımı GITHUB_TOKEN ile Pages sitesini AÇAMADI ("Resource
# not accessible by integration"; ilk çalıştırma, 2026-09-13). `gh-pages`
# dalına yazmak yalnızca `contents: write` ister; herkese açık depoda Pages bu
# dal için kendiliğinden açılır. Açılmazsa tek seferlik elle adım: Settings →
# Pages → Source "Deploy from a branch" → gh-pages / (root).
#
# Web'de SQLCipher yoktur; veritabanı sql.js ile bellekte çalışır ve görüntüsü
# WebCrypto (AES-GCM-256) ile şifreli olarak IndexedDB'de durur. Bu, SQLCipher
# olarak ANLATILMAZ (R93.4). Bulut senkronu yoktur (R116.3), analytics yoktur (R118).
name: V90 Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/90-day-challenge-architecture-gtyw5v
      - main
    paths:
      - 'v90/**'
      - '!v90/**.md'
      - '.github/workflows/v90-web.yml'

permissions:
  contents: write

# Dağıtımlar sıraya girer; yarım kalan dağıtım olmasın diye iptal edilmez.
concurrency:
  group: v90-web-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v90
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v90/package-lock.json

      # postinstall: sql-wasm*.wasm → public/ (export çıktısının köküne kopyalanır).
      - name: Bağımlılıklar
        run: npm ci

      - name: Web export + post-export (404.html, manifest, sw.js)
        env:
          V90_WEB_BASE_URL: /kredi-karti-takip
          EXPO_NO_TELEMETRY: '1'
        run: npm run export:web

      - name: Çıktı özeti
        run: |
          ls -la dist-web
          test -f dist-web/404.html
          test -f dist-web/sw.js
          test -f dist-web/manifest.webmanifest
          ls dist-web/sql-wasm*.wasm

      # gh-pages dalı tek commit olarak yeniden yazılır (force_orphan): eski
      # bundle'lar dalda birikmez. .nojekyll otomatik eklenir (enable_jekyll:
      # false varsayılan) — Jekyll `_expo/` gibi alt çizgili dizinleri yoksayardı.
      - name: gh-pages dalına yaz
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./v90/dist-web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'V90 web: ${{ github.sha }}'

      - name: Yayın adresi
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER}.github.io/${REPO}/"
          {
            echo "## V90 Web"
            echo
            echo "- Yayın adresi: $URL"
            echo "- Kaynak dal: gh-pages (Pages bu daldan yayınlar; ilk seferde açılmadıysa Settings → Pages → Deploy from a branch → gh-pages)"
            echo
            echo "Tarayıcıda çalışır; \"Ana ekrana ekle\" ile uygulama gibi açılır. Veri yalnızca bu tarayıcıda, şifreli görüntü olarak durur."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
